<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeScript for Next.js — Learning Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">TS<span class="logo-accent">→</span>Next</div>
      <p class="sidebar-sub">TypeScript for Next.js</p>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="theme-row">
        <span class="progress-label" style="margin:0">Theme</span>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon" id="themeIcon">☀</span>
          <span class="theme-label" id="themeLabel">Light</span>
        </button>
      </div>
      <div class="progress-label" style="margin-top:1rem">Your progress</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0 / 10 topics</div>
    </div>
  </aside>

  <!-- MOBILE HEADER -->
  <header class="mobile-header">
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="logo">TS<span class="logo-accent">→</span>Next</div>
    <button class="theme-toggle-mobile" id="themeToggleMobile" aria-label="Toggle theme">
      <span id="themeIconMobile">☀</span>
    </button>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="content-wrap" id="contentWrap"></div>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
